        const App = () => {
            // State: User passed course IDs
            const [passedCourses, setPassedCourses] = React.useState(() => {
                const saved = localStorage.getItem('cufe_cve_passed');
                return saved ? JSON.parse(saved) : [
                    'MTH_G001', 'MTH_G002', 'PHY_G001', 'EMC_G001', 'GEN_G001', 'INT_G001', 'INT_G005'

            // State: Selected courses for Fall schedule
            const [selectedFallCourses, setSelectedFallCourses] = React.useState(() => {
                const saved = localStorage.getItem('cufe_cve_fall_selected');
                return saved ? JSON.parse(saved) : [
                    { courseId: 'STR_G111', group: 'Civil1-01' },
                    { courseId: 'STR_G141', group: 'Civil1-01' },
                    { courseId: 'IHD_G111', group: 'Civil1-01' }
                ];
            });

            // Active Tab State
            const [activeTab, setActiveTab] = React.useState('planner'); // 'planner', 'registration', 'schedule'

            // Prerequisite Block Warning Modal State
            const [prereqModal, setPrereqModal] = React.useState({ show: false, course: null, missing: [] });

            // Toast Message State
            const [toast, setToast] = React.useState(null);

            // Persist passed courses
            React.useEffect(() => {
                localStorage.setItem('cufe_cve_passed', JSON.stringify(passedCourses));
            }, [passedCourses]);

            // Persist fall selection
            React.useEffect(() => {
                localStorage.setItem('cufe_cve_fall_selected', JSON.stringify(selectedFallCourses));
            }, [selectedFallCourses]);

            // Show Toast Helper
            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Calculate total passed credit hours
            const totalPassedHours = React.useMemo(() => {
                return COURSE_CATALOG
                    .filter(c => passedCourses.includes(c.id))
                    .reduce((sum, c) => sum + c.credits, 0);
            }, [passedCourses]);

            const passedPercentage = ((totalPassedHours / TOTAL_PROGRAM_HOURS) * 100).toFixed(1);

            // Calculate total registered Fall credit hours
            const totalRegisteredFallHours = React.useMemo(() => {
                return selectedFallCourses.reduce((sum, item) => {
                    const c = COURSE_CATALOG.find(course => course.id === item.courseId);
                    return sum + (c ? c.credits : 0);
                }, 0);
            }, [selectedFallCourses]);

            const fallPercentageOfTotal = ((totalRegisteredFallHours / TOTAL_PROGRAM_HOURS) * 100).toFixed(1);

            // Toggle course passed status
            const toggleCoursePassed = (courseId) => {
                if (passedCourses.includes(courseId)) {
                    // Check if removing this course breaks prerequisites for any other passed course
                    const dependentPassed = COURSE_CATALOG.filter(c => 
                        passedCourses.includes(c.id) && c.prereqs.includes(courseId)
                    );
                    if (dependentPassed.length > 0) {
                        showToast(`لا يمكن إلغاء هذه المادة لأنها متطلب سابق لـ: ${dependentPassed.map(d => d.code).join(', ')}`, 'warning');
                        return;
                    }

                    // Also remove from registered fall courses if present
                    setSelectedFallCourses(prev => prev.filter(s => s.courseId !== courseId));
                    setPassedCourses(prev => prev.filter(id => id !== courseId));
                    showToast('تم تحديث حالة المادة إلى غير مجتازة');
                } else {
                    // Check prerequisites before marking passed
                    const course = COURSE_CATALOG.find(c => c.id === courseId);
                    const missingPrereqs = course.prereqs.filter(pId => !passedCourses.includes(pId));
                    if (missingPrereqs.length > 0) {
                        const missingNames = missingPrereqs.map(pId => {
                            const p = COURSE_CATALOG.find(c => c.id === pId);
                            return p ? `${p.code} - ${p.name}` : pId;
                        });
                        setPrereqModal({ show: true, course, missing: missingNames });
                        return;
                    }
                    setPassedCourses(prev => [...prev, courseId]);
                    showToast(`تمت إضافة ${course.code} لقائمة المواد المجتازة 🎉`, 'success');
                }
            };

            // Register / Add Fall Course to Schedule
            const handleRegisterFallCourse = (courseId, defaultGroup = 'Civil1-01') => {
                const course = COURSE_CATALOG.find(c => c.id === courseId);
                if (!course) return;

                // Cannot register a course without passing prerequisites
                const missingPrereqs = course.prereqs.filter(pId => !passedCourses.includes(pId));
                if (missingPrereqs.length > 0) {
                    const missingNames = missingPrereqs.map(pId => {
                        const p = COURSE_CATALOG.find(c => c.id === pId);
                        return p ? `${p.code} - ${p.name}` : pId;
                    });
                    setPrereqModal({ show: true, course, missing: missingNames });
                    return;
                }

                // Check if already registered
                const isAlready = selectedFallCourses.some(s => s.courseId === courseId);
                if (isAlready) {
                    // Remove
                    setSelectedFallCourses(prev => prev.filter(s => s.courseId !== courseId));
                    showToast(`تم إلغاء تسجيل مادة ${course.code}`);
                } else {
                    // Determine smart default group based on year
                    let grp = 'Civil1-01';
                    if (course.yearNum === 2) grp = 'Civil2-01';
                    if (course.yearNum === 3) grp = 'Civil3-01';
                    if (course.yearNum === 0) grp = 'Group-01';

                    setSelectedFallCourses(prev => [...prev, { courseId, group: grp }]);
                    showToast(`تمت إضافة ${course.code} لجدول التسجيل بنجاح`, 'success');
                }
            };

            // Update Group selection for registered course
            const handleGroupChange = (courseId, newGroup) => {
                setSelectedFallCourses(prev => prev.map(item => {
                    if (item.courseId === courseId) {
                        return { ...item, group: newGroup };
                    }
                    return item;
                }));
            };

            // Helper to parse time string "08:00" -> 8.0, "08:30" -> 8.5
            const parseTime = (timeStr) => {
                const [h, m] = timeStr.split(':').map(Number);
                return h + m / 60;
            };

            // Generate flattened schedule events for selected courses
            const activeScheduleEvents = React.useMemo(() => {
                const events = [];
                selectedFallCourses.forEach(({ courseId, group }) => {
                    const course = COURSE_CATALOG.find(c => c.id === courseId);
                    const sched = SCHEDULE_DATABASE[courseId];
                    if (!course || !sched) return;

                    // Add lectures
                    if (sched.lecture) {
                        sched.lecture.forEach(lec => {
                            events.push({
                                courseId,
                                code: course.code,
                                name: course.name,
                                type: 'Lecture (محاضرة)',
                                day: lec.day,
                                start: lec.start,
                                end: lec.end,
                                room: lec.room,
                                group: 'الكل',
                                color: 'bg-indigo-600 text-white border-indigo-700'
                            });
                        });
                    }

                    // Add tutorial / lab for chosen group
                    if (sched.groups && sched.groups[group]) {
                        sched.groups[group].forEach(tut => {
                            events.push({
                                courseId,
                                code: course.code,
                                name: course.name,
                                type: tut.type === 'Lab' ? 'Lab (معمل)' : 'Tutorial (سكشن)',
                                day: tut.day,
                                start: tut.start,
                                end: tut.end,
                                room: tut.room,
                                group: group,
                                color: tut.type === 'Lab' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-sky-600 text-white border-sky-700'
                            });
                        });
                    }
                });
                return events;
            }, [selectedFallCourses]);

            // Conflict Detector
            const scheduleConflicts = React.useMemo(() => {
                const conflicts = [];
                for (let i = 0; i < activeScheduleEvents.length; i++) {
                    for (let j = i + 1; j < activeScheduleEvents.length; j++) {
                        const e1 = activeScheduleEvents[i];
                        const e2 = activeScheduleEvents[j];

                        if (e1.day === e2.day) {
                            const s1 = parseTime(e1.start);
                            const e1_end = parseTime(e1.end);
                            const s2 = parseTime(e2.start);
                            const e2_end = parseTime(e2.end);

                            // Check time overlap
                            if (Math.max(s1, s2) < Math.min(e1_end, e2_end)) {
                                conflicts.push({
                                    event1: e1,
                                    event2: e2,
                                    day: e1.day,
                                    timeOverlap: `${Math.max(s1, s2)}:00 - ${Math.min(e1_end, e2_end)}:00`
                                });
                            }
                        }
                    }
                }
                return conflicts;
            }, [activeScheduleEvents]);

            // Smart Multi-Conflict Resolution Algorithm (Single-Button Solver)
            const autoResolveAllConflicts = () => {
                if (selectedFallCourses.length === 0) return;

                // List of all course IDs currently registered
                const registeredCourseIds = selectedFallCourses.map(item => item.courseId);

                // Helper to calculate total conflicts for a given group configuration
                const evaluateConfigConflicts = (config) => {
                    const events = [];
                    config.forEach(({ courseId, group }) => {
                        const course = COURSE_CATALOG.find(c => c.id === courseId);
                        const sched = SCHEDULE_DATABASE[courseId];
                        if (!course || !sched) return;

                        if (sched.lecture) {
                            sched.lecture.forEach(lec => {
                                events.push({ courseId, day: lec.day, start: lec.start, end: lec.end });
                            });
                        }
                        if (sched.groups && sched.groups[group]) {
                            sched.groups[group].forEach(tut => {
                                events.push({ courseId, day: tut.day, start: tut.start, end: tut.end });
                            });
                        }
                    });

                    let conflictsCount = 0;
                    for (let i = 0; i < events.length; i++) {
                        for (let j = i + 1; j < events.length; j++) {
                            if (events[i].day === events[j].day) {
                                const s1 = parseTime(events[i].start);
                                const e1 = parseTime(events[i].end);
                                const s2 = parseTime(events[j].start);
                                const e2 = parseTime(events[j].end);
                                if (Math.max(s1, s2) < Math.min(e1, e2)) {
                                    conflictsCount++;
                                }
                            }
                        }
                    }
                    return conflictsCount;
                };

                // Options per course
                const courseOptions = registeredCourseIds.map(courseId => {
                    const sched = SCHEDULE_DATABASE[courseId];
                    if (sched && sched.groups && Object.keys(sched.groups).length > 0) {
                        return Object.keys(sched.groups);
                    }
                    return ['Civil1-01'];
                });

                // Backtracking Search to find 0 conflicts combination
                let solutionFound = null;

                const searchCombination = (index, currentAssignment) => {
                    if (solutionFound) return;
                    if (index === registeredCourseIds.length) {
                        if (evaluateConfigConflicts(currentAssignment) === 0) {
                            solutionFound = [...currentAssignment];
                        }
                        return;
                    }

                    const courseId = registeredCourseIds[index];
                    const groups = courseOptions[index];

                    for (const g of groups) {
                        currentAssignment.push({ courseId, group: g });
                        searchCombination(index + 1, currentAssignment);
                        currentAssignment.pop();
                        if (solutionFound) return;
                    }
                };

                searchCombination(0, []);

                if (solutionFound) {
                    setSelectedFallCourses(solutionFound);
                    showToast('🎉 تم حل جميع التعارضات بنجاح وإعادة ضبط السكاشن تلقائياً!', 'success');
                } else {

                }
            };

            // Smart Days Minimizer (تقليل عدد أيام النزول)
            const minimizeDaysOnCampus = () => {
                if (selectedFallCourses.length === 0) {
                    showToast('يرجى اختيار مواد بالجدول أولاً لتقليل عدد أيام النزول', 'warning');
                    return;
                }

                const registeredCourseIds = selectedFallCourses.map(item => item.courseId);

                // Options per course
                const courseOptions = registeredCourseIds.map(courseId => {
                    const sched = SCHEDULE_DATABASE[courseId];
                    if (sched && sched.groups && Object.keys(sched.groups).length > 0) {
                        return Object.keys(sched.groups);
                    }
                    return ['Civil1-01'];
                });

                // Helper to evaluate conflicts and active days for a group combination
                const evaluateConfig = (config) => {
                    const events = [];
                    config.forEach(({ courseId, group }) => {
                        const course = COURSE_CATALOG.find(c => c.id === courseId);
                        const sched = SCHEDULE_DATABASE[courseId];
                        if (!course || !sched) return;

                        if (sched.lecture) {
                            sched.lecture.forEach(lec => {
                                events.push({ courseId, day: lec.day, start: lec.start, end: lec.end });
                            });
                        }
                        if (sched.groups && sched.groups[group]) {
                            sched.groups[group].forEach(tut => {
                                events.push({ courseId, day: tut.day, start: tut.start, end: tut.end });
                            });
                        }
                    });

                    let conflictsCount = 0;
                    const activeDaysSet = new Set();

                    for (let i = 0; i < events.length; i++) {
                        activeDaysSet.add(events[i].day);
                        for (let j = i + 1; j < events.length; j++) {
                            if (events[i].day === events[j].day) {

                                const s2 = parseTime(events[j].start);
                                const e2 = parseTime(events[j].end);
                                if (Math.max(s1, s2) < Math.min(e1, e2)) {
                                    conflictsCount++;
                                }
                            }
                        }
                    }

                    return {
                        conflicts: conflictsCount,

                    };
                };

                let bestConfig = null;
                let minConflicts = Infinity;
                let minDays = Infinity;

                const searchCombination = (index, currentAssignment) => {
                    if (index === registeredCourseIds.length) {
                        const res = evaluateConfig(currentAssignment);
                        // Prioritize 0 conflicts first, then minimum days
                        if (res.conflicts < minConflicts) {
                            minConflicts = res.conflicts;
                            minDays = res.daysCount;
                            bestConfig = [...currentAssignment];
                        } else if (res.conflicts === minConflicts && res.daysCount < minDays) {

                            bestConfig = [...currentAssignment];
                        }

                    }

                    const courseId = registeredCourseIds[index];
                    const groups = courseOptions[index];

                        currentAssignment.push({ courseId, group: g });
                        searchCombination(index + 1, currentAssignment);
                        currentAssignment.pop();
                    }

                                            { year: 'Preparatory', label: 'مواد إعدادي هندسة - ترم أول' }
                                        ].map(({ year, label }) => {
                                            const fallCourses = COURSE_CATALOG.filter(c => c.year === year && c.term === 'Fall');

                                            return (
                                                <div key={year} className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                                    <h3 className="font-bold text-slate-800 text-sm mb-3 flex items-center justify-between">
                                                        <span>{label}</span>
                                                        <span className="text-xs text-slate-500 font-normal">
                                                            {fallCourses.length} مواد متاحة
                                                        </span>
                                                    </h3>

                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                        {fallCourses.map(course => {
                                                            const isPassed = passedCourses.includes(course.id);
                                                            const isRegistered = selectedFallCourses.some(s => s.courseId === course.id);
                                                            const currentRegObj = selectedFallCourses.find(s => s.courseId === course.id);

                                                            // Check prerequisites
                                                            const missingPrereqs = course.prereqs.filter(pId => !passedCourses.includes(pId));
                                                            const hasMissingPrereqs = missingPrereqs.length > 0;

                                                            // Group Options depending on course year
                                                            let groupOptions = ['Civil1-01', 'Civil1-02', 'Civil1-03', 'Civil1-04', 'Civil1-05', 'Civil1-06'];
                                                            if (course.yearNum === 2) groupOptions = ['Civil2-01', 'Civil2-02', 'Civil2-03', 'Civil2-04', 'Civil2-05', 'Civil2-06'];
                                                            if (course.yearNum === 3) groupOptions = ['Civil3-01', 'Civil3-02', 'Civil3-03', 'Civil3-04', 'Civil3-05', 'Civil3-06'];
                                                            if (course.yearNum === 0) groupOptions = ['Group-01', 'Group-02', 'Group-03'];

                                                            return (
                                                                <div
                                                                    key={course.id}
                                                                    className={`p-4 rounded-xl border transition-all flex flex-col justify-between ${
                                                                        isPassed
                                                                            ? 'bg-emerald-50/50 border-emerald-200 opacity-75'
                                                                            : isRegistered
                                                                            ? 'bg-sky-50 border-sky-300 shadow-sm'
                                                                            : hasMissingPrereqs
                                                                            ? 'bg-white border-amber-200/90'
                                                                            : 'bg-white border-slate-200 hover:border-slate-300'
                                                                    }`}
                                                                >
                                                                    <div>
                                                                        <div className="flex items-start justify-between gap-2">
                                                                            <div>
                                                                                <div className="font-extrabold text-xs code-font text-sky-800">
                                                                                    {course.code}
                                                                                </div>
                                                                                <div className="font-bold text-slate-800 text-xs mt-0.5">
                                                                                    {course.name}
                                                                                </div>
                                                                            </div>
                                                                            <span className="text-xs font-black px-2 py-0.5 bg-slate-100 text-slate-700 rounded border border-slate-200 whitespace-nowrap">
                                                                                {course.credits} ساعة
                                                                            </span>
                                                                        </div>

                                                                        {course.prereqs.length > 0 && (
                                                                            <div className="mt-2 text-[11px] text-slate-600">
                                                                                <span>المتطلب المطلوب: </span>
                                                                                <span className={`font-bold code-font ${hasMissingPrereqs ? 'text-amber-700' : 'text-emerald-700'}`}>
                                                                                    {course.prereqs.map(pId => {
                                                                                        const p = COURSE_CATALOG.find(c => c.id === pId);
                                                                                        return p ? p.code : pId;
                                                                                    }).join(', ')}
                                                                                </span>
                                                                                {hasMissingPrereqs && (
                                                                                    <span className="text-amber-600 mr-1 font-bold"> (غير مجتاز ❌)</span>
                                                                                )}
                                                                            </div>
                                                                        )}
                                                                    </div>

                                                                    <div className="mt-4 pt-3 border-t border-slate-200/60 flex items-center justify-between gap-2">
                                                                        {isRegistered ? (
                                                                            <div className="flex items-center gap-2">
                                                                                <span className="text-xs font-semibold text-slate-600">المجموعة:</span>
                                                                                <select
                                                                                    value={currentRegObj?.group || groupOptions[0]}
                                                                                    onChange={(e) => handleGroupChange(course.id, e.target.value)}
                                                                                    className="text-xs font-bold bg-white border border-slate-300 rounded-lg px-2 py-1 text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500"
                                                                                >
                                                                                    {groupOptions.map(g => (
                                                                                        <option key={g} value={g}>{g}</option>
                                                                                    ))}
                                                                                </select>
                                                                            </div>
                                                                        ) : (
                                                                            <div className="text-[11px] text-slate-400">
                                                                                {isPassed ? 'مادة مجتازة سابقاً' : hasMissingPrereqs ? 'يتطلب إنجاز المتطلب أولاً' : 'جاهزة للتسجيل'}
                                                                            </div>
                                                                        )}

                                                                        {isPassed ? (
                                                                            <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-lg">
                                                                                ✓ مجتازة
                                                                            </span>
                                                                        ) : isRegistered ? (
                                                                            <button
                                                                                onClick={() => handleRegisterFallCourse(course.id)}
                                                                                className="text-xs font-bold text-red-700 hover:text-red-800 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-200 transition-all cursor-pointer"
                                                                            >
                                                                                إلغاء التسجيل
                                                                            </button>
                                                                        ) : (
                                                                            <button
                                                                                onClick={() => handleRegisterFallCourse(course.id)}
                                                                                disabled={hasMissingPrereqs}
                                                                                className={`text-xs font-bold px-3.5 py-1.5 rounded-lg transition-all cursor-pointer ${
                                                                                    hasMissingPrereqs
                                                                                        ? 'bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed'
                                                                                        : 'bg-sky-600 hover:bg-sky-700 text-white shadow-sm'
                                                                                }`}
                                                                            >
                                                                                + تسجيل المادة
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: TIMETABLE & CONFLICT RESOLUTION */}
                        {activeTab === 'schedule' && (
                            <div className="space-y-6">
                                {/* Conflict Alert Banner with Single-Button Solver */}
                                {scheduleConflicts.length > 0 && (
                                    <div className="bg-red-50 border-2 border-red-300 rounded-2xl p-5 shadow-md no-print">
                                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                            <div className="flex items-start gap-3">
                                                <div className="w-10 h-10 rounded-xl bg-red-600 text-white flex items-center justify-center font-bold text-xl shrink-0 shadow">
                                                    ⚠️
                                                </div>
                                                <div>
                                                    <h3 className="font-extrabold text-red-900 text-base">
                                                        تم اكتشاف تعارض في مواعيد الجدول ({scheduleConflicts.length} تعارض)
                                                    </h3>
                                                    <p className="text-xs text-red-700 mt-1">
                                                        توجد مواعيد محاضرات أو سكاشن متداخلة في نفس التوقيت. يمكنك حل كل التعارضات بنقرة زر واحدة!
                                                    </p>
                                                </div>
                                            </div>

                                            {/* Single Magic Solver Button */}
                                            <button
                                                onClick={autoResolveAllConflicts}
                                                className="bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white font-extrabold text-sm px-5 py-3 rounded-xl shadow-lg border border-emerald-500 transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2 shrink-0 cursor-pointer"
                                            >
                                                <span>⚡ حل جميع التعارضات بضغطة زر واحدة</span>
                                            </button>
                                        </div>

                                        {/* List of active conflicts */}
                                        <div className="mt-4 pt-3 border-t border-red-200/80 space-y-2">
                                            {scheduleConflicts.map((conf, i) => (
                                                <div key={i} className="bg-white p-3 rounded-xl border border-red-200 text-xs text-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-2 shadow-xs">
                                                    <div>
                                                        <span className="font-bold text-red-700">تعارض يوم {conf.day}: </span>
                                                        <span className="font-semibold">{conf.event1.code} ({conf.event1.type})</span>
                                                        {' ⚡ يتداخل مع ⚡ '}
                                                        <span className="font-semibold">{conf.event2.code} ({conf.event2.type})</span>
                                                    </div>
                                                    <div className="text-slate-600 font-mono bg-slate-100 px-2 py-0.5 rounded border border-slate-200">
                                                        توقيت التداخل: {conf.event1.start} - {conf.event1.end}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Timetable Header & Optimization Actions */}
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4 no-print">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-900">
                                            الجدول الدراسي الأسبوعي لمواد الترم الأول المختارة
                                        </h2>
                                        <p className="text-xs text-slate-500">
                                            مخطط أسبوعي متكامل للمحاضرات والسكاشن والمعامل
                                        </p>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-3">
                                        <button
                                            onClick={minimizeDaysOnCampus}
                                            className="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl transition-all shadow-md flex items-center gap-2 cursor-pointer border border-indigo-500"
                                            title="إعادة توزيع مجموعات السكاشن والمعامل للحصول على أقل عدد من أيام الحضور بدون تعارضات"
                                        >
                                            <span>🗓️ تقليل عدد أيام النزول</span>
                                        </button>

                                        <button
                                            onClick={() => window.print()}
                                            className="px-5 py-2.5 bg-slate-900 hover:bg-black text-white font-bold text-xs rounded-xl transition-all shadow-md flex items-center gap-2 cursor-pointer"
                                        >
                                            <span>🖨️ طباعة الجدول (A4 Landscape)</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Schedule Table Grid */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto p-4">
                                    <table className="w-full text-right border-collapse min-w-[800px]">
                                        <thead>
                                            <tr className="bg-slate-100 border-b border-slate-200 text-slate-700 text-xs">
                                                <th className="p-3 text-center border-l border-slate-200 font-extrabold w-24">اليوم</th>
                                                {['08:00 - 09:50', '10:00 - 11:50', '12:00 - 13:50', '14:00 - 15:50'].map((slotStr, i) => (
                                                    <th key={i} className="p-3 text-center border-l border-slate-200 font-bold">
                                                        {slotStr}
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 text-xs">
                                            {['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday'].map(dayName => {
                                                const arabicDays = {
                                                    'Sunday': 'الأحد',
                                                    'Monday': 'الإثنين',
                                                    'Tuesday': 'الثلاثاء',
                                                    'Wednesday': 'الأربعاء',
                                                    'Thursday': 'الخميس'
                                                };

                                                const dayEvents = activeScheduleEvents.filter(e => e.day === dayName);

                                                return (
                                                    <tr key={dayName} className="hover:bg-slate-50/50">
                                                        <td className="p-3 font-bold text-slate-800 bg-slate-50 text-center border-l border-slate-200">
                                                            {arabicDays[dayName]}
                                                        </td>

                                                        {[
                                                            { start: 8, end: 10 },
                                                            { start: 10, end: 12 },
                                                            { start: 12, end: 14 },
                                                            { start: 14, end: 16 }
                                                        ].map((timeRange, rangeIdx) => {
                                                            const slotEvents = dayEvents.filter(ev => {
                                                                const evStart = parseTime(ev.start);
                                                                const evEnd = parseTime(ev.end);
                                                                return Math.max(evStart, timeRange.start) < Math.min(evEnd, timeRange.end);
                                                            });

                                                            const isConflicted = slotEvents.length > 1;

                                                            return (
                                                                <td key={rangeIdx} className={`p-2 border-l border-slate-200 align-top h-28 min-w-[160px] ${isConflicted ? 'bg-red-50/80' : ''}`}>
                                                                    {slotEvents.map((ev, eIdx) => (
                                                                        <div
                                                                            key={eIdx}
                                                                            className={`slot-card p-2.5 rounded-xl border shadow-xs mb-1.5 transition-all text-xs ${
                                                                                isConflicted
                                                                                    ? 'bg-red-600 text-white border-red-800 animate-pulse'
                                                                                    : ev.type.includes('Lecture')
                                                                                    ? 'bg-sky-700 text-white border-sky-800'
                                                                                    : ev.type.includes('Lab')
                                                                                    ? 'bg-emerald-700 text-white border-emerald-800'
                                                                                    : 'bg-indigo-700 text-white border-indigo-800'
                                                                            }`}
                                                                        >
                                                                            <div className="font-black code-font text-xs flex items-center justify-between">
                                                                                <span>{ev.code}</span>
                                                                                <span className="text-[10px] opacity-90">{ev.room}</span>
                                                                            </div>
                                                                            <div className="text-[11px] font-semibold mt-0.5 truncate">
                                                                                {ev.name}
                                                                            </div>
                                                                            <div className="text-[10px] opacity-90 mt-1 flex items-center justify-between">
                                                                                <span>{ev.type}</span>
                                                                                <span>مجموعة: {ev.group}</span>
                                                                            </div>
                                                                            <div className="text-[10px] font-mono mt-0.5 opacity-80">
                                                                                ⏱️ {ev.start} - {ev.end}
                                                                            </div>
                                                                        </div>
                                                                    ))}
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>

                                {/* Registered Courses Summary Table */}
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                    <h3 className="font-bold text-slate-900 text-base mb-4">
                                        قائمة المواد المسجلة بالجدول ونسبتها من ساعات القسم الكلية
                                    </h3>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-right border-collapse text-xs">
                                            <thead>
                                                <tr className="bg-slate-100 text-slate-700 border-b border-slate-200 font-bold">
                                                    <th className="p-3">كود المادة</th>
                                                    <th className="p-3">اسم المادة بالإنجليزية</th>
                                                    <th className="p-3">السنة الدراسية</th>
                                                    <th className="p-3 text-center">المجموعة (Group)</th>
                                                    <th className="p-3 text-center">الساعات المعتمدة</th>
                                                    <th className="p-3 text-center">النسبة من إجمالي ساعات القسم (144 س)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-200">
                                                {selectedFallCourses.map(({ courseId, group }) => {
                                                    const course = COURSE_CATALOG.find(c => c.id === courseId);
                                                    if (!course) return null;
                                                    const pct = ((course.credits / TOTAL_PROGRAM_HOURS) * 100).toFixed(2);

                                                    return (
                                                        <tr key={courseId} className="hover:bg-slate-50">
                                                            <td className="p-3 font-extrabold code-font text-sky-800">{course.code}</td>
                                                            <td className="p-3 font-semibold text-slate-800">{course.name}</td>
                                                            <td className="p-3 text-slate-600">{course.year}</td>
                                                            <td className="p-3 text-center font-bold text-slate-700">{group}</td>
                                                            <td className="p-3 text-center font-bold text-slate-900">{course.credits} ساعة</td>
                                                            <td className="p-3 text-center font-bold text-emerald-700">{pct}%</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                            <tfoot>
                                                <tr className="bg-slate-900 text-white font-bold">
                                                    <td colSpan="4" className="p-3 text-left">إجمالي ساعات الجدول المسجل:</td>
                                                    <td className="p-3 text-center text-sky-400">{totalRegisteredFallHours} ساعة</td>
                                                    <td className="p-3 text-center text-emerald-400">{fallPercentageOfTotal}%</td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Prerequisite Warning Modal */}
                    {prereqModal.show && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 modal-overlay">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
                                <div className="w-12 h-12 bg-amber-100 text-amber-700 rounded-xl flex items-center justify-center font-bold text-2xl mb-4">
                                    ⚠️
                                </div>
                                <h3 className="text-lg font-bold text-slate-900 mb-2">
                                    متطلب سابق غير مجتاز!
                                </h3>
                                <p className="text-sm text-slate-600 mb-4">
                                    لا يمكنك تسجيل أو إنجاز مادة <span className="font-extrabold text-slate-900">{prereqModal.course?.code} - {prereqModal.course?.name}</span> قبل اجتياز المواد التالية أولاً:
                                </p>
                                <ul className="bg-amber-50 border border-amber-200 rounded-xl p-3 mb-6 text-xs text-amber-900 space-y-1 font-semibold">
                                    {prereqModal.missing.map((m, idx) => (
                                        <li key={idx} className="flex items-center gap-2">
                                            <span>•</span>
                                            <span>{m}</span>
                                        </li>
                                    ))}
                                </ul>
                                <button
                                    onClick={() => setPrereqModal({ show: false, course: null, missing: [] })}
                                    className="w-full bg-slate-900 hover:bg-black text-white font-bold py-2.5 rounded-xl transition-all text-xs cursor-pointer"
                                >
                                    فهمت ذلك
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
